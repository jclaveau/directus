name: Check

# Scalabus: the full gate on EVERY commit, any branch — not just PRs into the release
# branches. hhh-dev became the work branch after the old base-branch filter was set, so
# that filter silently skipped it (no unit tests, no coverage upload codecov needs).
# GHA loads a push workflow from the pushed branch itself, so it fires regardless of base.
#
# `push` only, every branch. Running both events meant every job reported twice — and
# the `branches-ignore` list that was meant to prevent that enumerated prefixes
# (`feat/**`, `*-fix/**`, …), so a branch outside the list, `v11.10.1-perf/…` for one,
# matched neither rule and got both. Gating the jobs on `github.event_name` instead
# still left a skipped twin of every check on the PR, so the diff-scoped gate — the
# only job here that needed a PR base — moved to style-changes.yml and this file
# dropped `pull_request` altogether. Checks attach to the commit, not the event, so
# these still show on the PR.
on:
  push:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: --max_old_space_size=6144

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v46

      - name: Prepare
        uses: ./.github/actions/prepare
        with:
          build: false

      - name: Run Linter
        run: pnpm exec eslint ${{ steps.changed-files.outputs.all_changed_files }}

  stylelint:
    name: Stylelint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v46

      - name: Prepare
        uses: ./.github/actions/prepare
        with:
          build: false

      - name: Run Stylelinter
        run: pnpm exec stylelint ${{ steps.changed-files.outputs.all_changed_files }} --allow-empty-input

  format:
    name: Format
    # `eslint.style.config.js` (via the Style (changes) job / `pnpm lint:style:changes`) is the
    # style authority. Kept as a passing no-op so a required "Format" check (if branch protection
    # still lists it) goes green instead of stranding pending.
    runs-on: ubuntu-latest
    steps:
      - name: Format check
        run: echo "Formatting handled by eslint.style.config.js (see the Style (changes) job)."


  unit:
    # Sharded across parallel runners because the suite ran serially package-by-package
    # (small pkgs -> @directus/app -> @directus/api), each heavy pkg already saturating the
    # 2-core runner. @directus/api (~3m) and @directus/app (~2m) are the two dominant packages,
    # so each gets its own shard and everything else lands in `rest`. This splits both the test
    # phase AND the per-package Codecov upload load, which had become the tail on the combined
    # shard. Coverage stays correct: each shard uploads only the coverage it produced and
    # Codecov merges the per-folder flags on the shared commit, so no dedicated merge job.
    name: Unit Tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [api, app, rest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

        # This currently builds all packages in the repo. Ideally we add build: false here as well
        # to save minutes building the repo, but that'd require us refactoring the tests to stop
        # using @directus/* packages within tests
      - name: Prepare
        uses: ./.github/actions/prepare

      - name: Run Tests
        run: |
          case "${{ matrix.shard }}" in
            api)
              pnpm --filter @directus/api test:coverage --passWithNoTests
              ;;
            app)
              pnpm --filter @directus/app test:coverage --passWithNoTests
              ;;
            rest)
              pnpm --recursive --filter '!tests-blackbox' --filter '!@directus/api' --filter '!@directus/app' test:coverage --passWithNoTests
              ;;
          esac

      - name: Upload coverage to Codecov
        if: always()
        continue-on-error: true # Scalabus: a failed upload must not red the test job
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }} # required: protected repo rejects tokenless uploads
        run: |
          # Download and install Codecov uploader
          curl -Os https://cli.codecov.io/latest/linux/codecov
          chmod +x codecov

          # Find all coverage files and upload them with flags based on folder names
          find . -name "coverage-final.json" -path "*/coverage/*" | while read -r coverage_file; do
            # Extract the folder name that contains the coverage directory
            folder_name=$(echo "$coverage_file" | sed -E 's|.*/(.*)/coverage/.*|\1|')
            echo "Uploading coverage for $folder_name from $coverage_file"

            # Upload to codecov with folder name as flag
            ./codecov upload-coverage -f "$coverage_file" -F "$folder_name" -Z --disable-search
          done
