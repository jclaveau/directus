name: Blackbox Tests

on:
  push:
    branches:
      - main
      - v11.10.1-prepare
    paths:
      - api/**
      - tests/blackbox/**
      - packages/**
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/blackbox.yml
  workflow_call:
    inputs:
      full:
        description: 'Run the full DB matrix (all vendors) instead of the pg+sqlite smoke set'
        type: boolean
        default: false
      shards:
        description: 'Number of parallel shards to split each vendor db test run across'
        type: number
        # Sized for wall clock, not runner minutes: every shard re-runs the ~110s
        # `before` chain, so more shards cost more total minutes while shortening
        # the loop everyone waits on.
        default: 8

permissions:
  contents: read

concurrency:
  group: blackbox-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: --max_old_space_size=6144
  # Setting COVERAGE_DIR flips api/tsdown.config.ts to instrument with rolldown-plugin-istanbul,
  # and the spawned blackbox servers (which inherit process.env) dump __coverage__ here on shutdown.
  COVERAGE_DIR: ${{ github.workspace }}/coverage/blackbox

jobs:
  setup:
    name: setup
    runs-on: ubuntu-latest
    outputs:
      vendors: ${{ steps.matrix.outputs.vendors }}
      shards: ${{ steps.matrix.outputs.shards }}
      shardCount: ${{ steps.matrix.outputs.shardCount }}
    steps:
      # `.github/ci-dialect` is read from the branch, so the checkout has to come first.
      - name: Checkout repository
        uses: actions/checkout@v7

      # Default DB matrix is the postgres smoke set. The full vendor matrix runs on a
      # push to a trunk branch, or on a PR carrying the `Run Blackbox Full` label (passed in
      # as `inputs.full` by blackbox-pr.yml). Each vendor's db files are split across N shards.
      - name: Select vendor + shard matrix
        id: matrix
        run: |
          if [ -f .github/ci-dialect ]; then
            # A standing dialect branch (see refresh-dialect-ci.yml) declares the one
            # vendor it exists to exercise. The branch content is the declaration, so
            # the PR is self-describing and needs no label.
            VENDOR="$(tr -d '[:space:]' < .github/ci-dialect)"
            echo "vendors=[\"$VENDOR\"]" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.full }}" = "true" ]; then
            # mysql, mssql, oracle dropped — not supported/maintained on this fork.
            # Re-add to the array to support: "mysql","mssql","oracle".
            echo 'vendors=["sqlite3","postgres","maria"]' >> "$GITHUB_OUTPUT"
          else
            # sqlite3 and maria are held out of the smoke set: at 8 shards a vendor the
            # matrices queue behind each other on the runner pool, and the wait cost more
            # wall clock than the shards saved. This fork runs on postgres. The other two
            # are covered by their standing dialect branches, which re-run against every
            # `v11.10.1-hhh-dev` tip. Re-add here to gate a dialect on every PR again.
            echo 'vendors=["postgres"]' >> "$GITHUB_OUTPUT"
          fi
          SHARD_COUNT="${{ inputs.shards || 3 }}"
          echo "shardCount=$SHARD_COUNT" >> "$GITHUB_OUTPUT"
          echo "shards=$(seq 1 "$SHARD_COUNT" | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

  common:
    name: common
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Prepare
        uses: ./.github/actions/prepare

      - name: Start services
        run:
          docker compose -f tests/blackbox/docker-compose.yml up auth-saml redis minio minio-mc -d --quiet-pull --wait

      - name: Run tests
        run: TEST_DB=sqlite3 pnpm run test:blackbox --project common

      - name: Merge + upload blackbox coverage
        if: always()
        continue-on-error: true # Scalabus: a failed coverage upload must not red the test job
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }} # required: protected repo rejects tokenless uploads
        run: |
          pnpm --filter tests-blackbox merge-coverage
          curl -Os https://cli.codecov.io/latest/linux/codecov
          chmod +x codecov

          # Pin the PR head sha: in this reusable workflow the codecov CLI otherwise detects
          # the checked-out merge commit, so the flag would land on the ephemeral merge ref
          # instead of the PR head (where the unit flags live) and never show on the PR.
          COMMIT_SHA="${{ github.event.pull_request.head.sha || github.sha }}"

          # A standing dialect branch is one throwaway commit over a trunk tip, force-replaced
          # on the next refresh — coverage pinned to it would be orphaned, and the dialect-only
          # lines (`database/helpers/*/dialects/sqlite.ts` plus the vendor branches in shared
          # code, 29 of them measured) would read as uncovered on the trunk forever. Attribute
          # it to the trunk commit the branch was cut from instead, recorded at refresh time
          # because this job checks out shallow and a pull_request HEAD is the merge commit.
          # Codecov merges same-flag uploads on a shared commit, exactly as the postgres shards
          # already do, and `carryforward: true` on the blackbox flag propagates the union.
          if [ -f .github/ci-dialect-base ]; then
            COMMIT_SHA="$(cat .github/ci-dialect-base)"
          fi

          ./codecov upload-coverage -f "$COVERAGE_DIR/lcov.info" -F blackbox -Z --disable-search \
            -C "$COMMIT_SHA"

  db:
    name: ${{ matrix.vendor }} (shard ${{ matrix.shard }})
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Smoke set (sqlite3 + postgres) by default; full vendor set when setup selects it.
        # cockroachdb stays excluded everywhere for now. Each (vendor, shard) is a fresh runner
        # with its own DB, so shards are fully isolated; the sequencer splits the files.
        vendor: ${{ fromJSON(needs.setup.outputs.vendors) }}
        shard: ${{ fromJSON(needs.setup.outputs.shards) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Prepare
        uses: ./.github/actions/prepare

      - name: Start database
        if: matrix.vendor != 'sqlite3'
        run: docker compose -f tests/blackbox/docker-compose.yml up ${{ matrix.vendor }} -d --quiet-pull --wait

      # pgbouncer fronts the postgres service; the pool-exhaustion test routes a
      # named connection through it to reach the real query_wait_timeout error.
      - name: Start pgbouncer
        if: matrix.vendor == 'postgres'
        run: docker compose -f tests/blackbox/docker-compose.yml up pgbouncer -d --quiet-pull --wait

      - name: MSSQL Set Compatibility Level
        if: matrix.vendor == 'mssql'
        run: |
          for i in {1..30}
          do
            docker exec blackbox-mssql-1 \
              /opt/mssql-tools18/bin/sqlcmd -S localhost -U SA -P 'Test@123' -C \
              -Q "SELECT 1" && break
            sleep 2
          done
          docker exec blackbox-mssql-1 \
            /opt/mssql-tools18/bin/sqlcmd -S localhost -U SA -P 'Test@123' -C \
            -Q "ALTER DATABASE model SET COMPATIBILITY_LEVEL = 150" \
            -l 30
          echo "MSSQL compatibility level set successfully"

      - name: Start services
        run:
          docker compose -f tests/blackbox/docker-compose.yml up auth-saml redis minio minio-mc -d --quiet-pull --wait

      - name: Run tests
        run: >-
          TEST_DB=${{ matrix.vendor }}
          SHARD_INDEX=${{ matrix.shard }}
          SHARD_COUNT=${{ needs.setup.outputs.shardCount }}
          pnpm run test:blackbox --project db
          --shard=${{ matrix.shard }}/${{ needs.setup.outputs.shardCount }}

      - name: Merge + upload blackbox coverage
        if: always()
        continue-on-error: true # Scalabus: a failed coverage upload must not red the test job
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }} # required: protected repo rejects tokenless uploads
        run: |
          pnpm --filter tests-blackbox merge-coverage
          curl -Os https://cli.codecov.io/latest/linux/codecov
          chmod +x codecov

          # Pin the PR head sha: in this reusable workflow the codecov CLI otherwise detects
          # the checked-out merge commit, so the flag would land on the ephemeral merge ref
          # instead of the PR head (where the unit flags live) and never show on the PR.
          COMMIT_SHA="${{ github.event.pull_request.head.sha || github.sha }}"

          # A standing dialect branch is one throwaway commit over a trunk tip, force-replaced
          # on the next refresh — coverage pinned to it would be orphaned, and the dialect-only
          # lines (`database/helpers/*/dialects/sqlite.ts` plus the vendor branches in shared
          # code, 29 of them measured) would read as uncovered on the trunk forever. Attribute
          # it to the trunk commit the branch was cut from instead, recorded at refresh time
          # because this job checks out shallow and a pull_request HEAD is the merge commit.
          # Codecov merges same-flag uploads on a shared commit, exactly as the postgres shards
          # already do, and `carryforward: true` on the blackbox flag propagates the union.
          if [ -f .github/ci-dialect-base ]; then
            COMMIT_SHA="$(cat .github/ci-dialect-base)"
          fi

          ./codecov upload-coverage -f "$COVERAGE_DIR/lcov.info" -F blackbox -Z --disable-search \
            -C "$COMMIT_SHA"
