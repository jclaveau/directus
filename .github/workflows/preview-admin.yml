name: Preview Admin

# Manual only. Boots this ref's Directus (postgres + redis, scoped cache on) on a GitHub
# runner and exposes its admin UI through an OUTBOUND cloudflared quick tunnel (runners take
# no ingress). A tiny request-stamping proxy sits in front so the job auto-shuts-down after
# `idle_minutes` with no requests. Seeds `items` → `sub_items` (both with a `user_created`)
# so the scoped-cache field can be tried on real collections. The tunnel is PUBLIC while the
# job runs — a random admin password is printed to the run summary (repo members only).
# Ephemeral: the URL dies with the job.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch/tag/SHA to boot (the code whose admin you want to see)
        type: string
        default: v11.10.1-hhh-dev
      idle_minutes:
        description: Auto-shutdown after this many minutes with no requests
        type: number
        default: 15

permissions:
  contents: read

jobs:
  preview:
    name: preview
    runs-on: ubuntu-latest
    # Hard backstop; the idle watcher normally ends the job long before this.
    timeout-minutes: 180
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: directus
          POSTGRES_PASSWORD: directus
          POSTGRES_DB: directus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U directus"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_CLIENT: pg
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_DATABASE: directus
      DB_USER: directus
      DB_PASSWORD: directus
      KEY: preview
      SECRET: preview
      CACHE_ENABLED: 'true'
      CACHE_STORE: redis
      REDIS: redis://localhost:6379
      CACHE_AUTO_PURGE: 'true'
      CACHE_AUTO_PURGE_MODE: scoped
      ADMIN_EMAIL: admin@example.com
      # Off so the app never opens a WebSocket the front proxy would have to carry.
      WEBSOCKETS_ENABLED: 'false'
      PORT: '8055'
    steps:
      - name: Checkout the ref to preview
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Prepare
        uses: ./.github/actions/prepare

      - name: Start tunnel
        run: |
          curl -sL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o /tmp/cf
          chmod +x /tmp/cf
          # Tunnel to the front proxy (8056); it 502s until Directus is up a step later.
          /tmp/cf tunnel --no-autoupdate --url http://localhost:8056 > /tmp/cf.log 2>&1 &

          for _ in $(seq 1 30); do
            URL=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/cf.log | head -1)
            [ -n "$URL" ] && break
            sleep 2
          done

          if [ -z "${URL:-}" ]; then
            echo "cloudflared did not produce a URL"; cat /tmp/cf.log; exit 1
          fi

          echo "URL=$URL" >> "$GITHUB_ENV"

      - name: Bootstrap + start Directus
        run: |
          # Not masked on purpose: it must show in the run summary so you can log in.
          # The summary is repo-members-only and this is a throwaway instance.
          PW=$(openssl rand -hex 12)
          echo "ADMIN_PASSWORD=$PW" >> "$GITHUB_ENV"

          ADMIN_PASSWORD="$PW" node directus/cli.js bootstrap
          ADMIN_PASSWORD="$PW" PUBLIC_URL="$URL" node directus/cli.js start \
            > /tmp/directus.log 2>&1 &

          for _ in $(seq 1 60); do
            curl -sf http://localhost:8055/server/health >/dev/null 2>&1 && break
            sleep 2
          done

      - name: Seed items → sub_items
        run: |
          cat > /tmp/seed.mjs <<'JS'
          const BASE = 'http://localhost:8055';

          const login = await fetch(`${BASE}/auth/login`, {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ email: 'admin@example.com', password: process.env.ADMIN_PASSWORD }),
          });

          const token = (await login.json()).data.access_token;
          const H = { 'content-type': 'application/json', authorization: `Bearer ${token}` };
          const post = (p, b) => fetch(`${BASE}${p}`, { method: 'POST', headers: H, body: JSON.stringify(b) });

          const idField = {
            field: 'id',
            type: 'integer',
            meta: { hidden: true, interface: 'input', readonly: true },
            schema: { is_primary_key: true, has_auto_increment: true },
          };

          const userCreated = (collection) => [
            post(`/fields/${collection}`, {
              field: 'user_created',
              type: 'uuid',
              meta: { special: ['user-created'], interface: 'select-dropdown-m2o' },
              schema: {},
            }),
            post('/relations', {
              collection,
              field: 'user_created',
              related_collection: 'directus_users',
            }),
          ];

          await post('/collections', { collection: 'items', schema: {}, meta: {}, fields: [idField] });
          for (const r of userCreated('items')) await r;

          await post('/collections', { collection: 'sub_items', schema: {}, meta: {}, fields: [idField] });

          await post('/fields/sub_items', {
            field: 'item',
            type: 'integer',
            meta: { special: ['m2o'], interface: 'select-dropdown-m2o' },
            schema: {},
          });

          await post('/relations', { collection: 'sub_items', field: 'item', related_collection: 'items' });
          for (const r of userCreated('sub_items')) await r;

          console.log('seeded items + sub_items');
          JS
          node /tmp/seed.mjs

      - name: Front proxy + idle shutdown
        env:
          IDLE_MINUTES: ${{ inputs.idle_minutes }}
        run: |
          cat > /tmp/proxy.cjs <<'JS'
          const http = require('http');
          const fs = require('fs');
          const STAMP = '/tmp/lasthit';
          const stamp = () => fs.writeFileSync(STAMP, '');
          const server = http.createServer((req, res) => {
            stamp();
            const up = http.request(
              { host: '127.0.0.1', port: 8055, path: req.url, method: req.method, headers: req.headers },
              (r) => { res.writeHead(r.statusCode || 502, r.headers); r.pipe(res); },
            );
            up.on('error', () => { res.writeHead(502); res.end('upstream error'); });
            req.pipe(up);
          });
          server.listen(8056, stamp);
          JS
          node /tmp/proxy.cjs &

          {
            echo "### Preview admin"
            echo ""
            echo "- **Ref:** ${{ inputs.ref }}"
            echo "- **URL:** ${URL}/admin"
            echo "- **Login:** admin@example.com / \`${ADMIN_PASSWORD}\`"
            echo "- Seeded collections: \`items\` → \`sub_items\` (both with \`user_created\`)."
            echo "- Auto-shuts-down after ${IDLE_MINUTES} min with no requests."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::notice title=Preview admin::${URL}/admin"

          IDLE=$(( IDLE_MINUTES * 60 ))

          while true; do
            sleep 30
            LAST=$(stat -c %Y /tmp/lasthit 2>/dev/null || echo 0)
            if [ $(( $(date +%s) - LAST )) -ge "$IDLE" ]; then
              echo "No requests for ${IDLE}s — shutting down."
              exit 0
            fi
          done
