name: Preview Admin

# Boots a ref's Directus (postgres + redis, scoped cache on) on a GitHub runner and exposes
# its admin UI through an OUTBOUND cloudflared quick tunnel (runners take no ingress). Runs
# manually (workflow_dispatch on any ref) OR automatically on every push to a PR carrying the
# `Preview` label. The job stays up until its hard timeout (no idle shutdown). Seeds `items`
# → `sub_items` (both with a `user_created`) so the scoped-cache
# field can be tried on real collections. The tunnel is PUBLIC while the job runs and, on a
# public repo, so is the run summary that prints the admin password — treat the whole preview
# as public (auto-login already grants full access with no password). Ephemeral: the URL dies
# with the job.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch/tag/SHA to boot (the code whose admin you want to see)
        type: string
        default: v11.10.1-hhh-dev
      instances:
        description: How many PM2 cluster workers to run (the Processes tree shows each)
        type: string
        default: '3'
      pr:
        description: PR number to publish the preview link into (blank to publish nowhere)
        type: string
        default: ''
      timeout_minutes:
        description: Minutes the preview stays up (the job's hard timeout)
        type: string
        default: '180'
  # Auto-boot on every push to a PR that carries the `Preview` label (and when the
  # label is first added). pull_request_target resolves this file from the PR's BASE
  # branch, so the workflow must also live on the branches PRs target.
  pull_request_target:
    types: [labeled, synchronize, edited]

permissions:
  contents: read
  # Post the preview link + throwaway credentials as a PR comment (pull_request_target runs).
  pull-requests: write

jobs:
  preview:
    name: preview
    runs-on: ubuntu-latest
    # Manual runs always; PR runs while the `Preview` label is present, or when the
    # re-run checkbox in the PR description is ticked (edited event).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.action == 'labeled' && github.event.label.name == 'Preview') ||
      (github.event.action == 'synchronize' &&
        contains(github.event.pull_request.labels.*.name, 'Preview')) ||
      (github.event.action == 'edited' &&
        contains(github.event.pull_request.labels.*.name, 'Preview') &&
        contains(github.event.pull_request.body, '[x] 🔄 Re-run admin preview'))
    # Hard backstop; the idle watcher normally ends the job long before this.
    timeout-minutes: ${{ fromJSON(inputs.timeout_minutes || '180') }}
    # One live preview per PR: a new push cancels the PR's still-running preview.
    # Job-level, so a skipped run (a description edit with the box unticked) never
    # joins the group and cannot cancel the live one.
    concurrency:
      group: preview-admin-${{ github.event.pull_request.number || inputs.ref || github.ref }}
      cancel-in-progress: true
    services:
      postgres:
        image: ghcr.io/jclaveau/postgres:16-alpine
        env:
          POSTGRES_USER: directus
          POSTGRES_PASSWORD: directus
          POSTGRES_DB: directus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U directus"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: ghcr.io/jclaveau/valkey:9.1.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # The PR description block, rewritten at each state of the run. Kept in the
      # workflow, not in a file: the head code this job runs cannot rewrite it.
      PREVIEW_PR: ${{ github.event.pull_request.number || inputs.pr }}
      PREVIEW_SHA: ${{ github.event.pull_request.head.sha || inputs.ref }}
      PREVIEW_TIMEOUT_MINUTES: ${{ inputs.timeout_minutes || '180' }}
      PREVIEW_PUBLISHER: |
        import json, os, re, subprocess, sys, time

        preview_state = sys.argv[1]
        pr_number = os.environ['PREVIEW_PR']
        if not pr_number:
            sys.exit(0)

        repository = os.environ['GITHUB_REPOSITORY']
        run_id = os.environ['GITHUB_RUN_ID']
        run_url = f"{os.environ['GITHUB_SERVER_URL']}/{repository}/actions/runs/{run_id}"
        started_at = int(os.environ['PREVIEW_STARTED_AT'])
        deadline = started_at + int(os.environ['PREVIEW_TIMEOUT_MINUTES']) * 60
        now = int(time.time())
        tunnel_url = os.environ.get('URL', '')

        def utc_clock(epoch_seconds):
            return time.strftime('%H:%M UTC', time.gmtime(epoch_seconds))

        if preview_state in ('claimed', 'booting'):
            state_line = f"⏳ deploying since {utc_clock(started_at)}"
        elif preview_state == 'deployed' and os.environ.get('FIXTURES_OUTCOME') == 'failure':
            state_line = f"🟡 deployed, a fixture script failed, up until ~{utc_clock(deadline)}"
        elif preview_state == 'deployed':
            state_line = f"🟢 deployed, up until ~{utc_clock(deadline)}"
        elif preview_state == 'cancelled' and now >= deadline - 60:
            state_line = f"⌛ timeout passed at {utc_clock(now)}, link dead"
        elif preview_state == 'cancelled':
            state_line = f"⚫ cancelled at {utc_clock(now)}, link dead"
        elif preview_state == 'failed':
            state_line = f"🔴 failed at {utc_clock(now)}, link dead"
        else:
            raise SystemExit(f"unknown preview state {json.dumps(preview_state)}")

        block_lines = [
            '<!-- admin-preview:start -->',
            f"### 🔎 Preview admin — `{os.environ['PREVIEW_SHA']}`",
            '',
            f"- **State:** {state_line} · [run {run_id}]({run_url})",
        ]
        if tunnel_url and preview_state in ('booting', 'deployed'):
            block_lines += [
                f"- **Open (auto-login):** {tunnel_url}/auto-login",
                f"- Manual: {tunnel_url}/admin as `admin@example.com` (password in the run summary; on a public repo that summary is world-readable).",
            ]
        if preview_state == 'booting':
            block_lines.append('- The tunnel answers 502 until Directus finishes booting.')
        block_lines += [
            '- Seeded: `items` → `sub_items` (both with `user_created`), then the `scripts/preview-admin/fixtures/*.mjs` the ref ships.',
            '- Subscriptions bundle loaded when the ref ships it, with no Stripe or Mollie key: its tables and admin show, no provider is called.',
            '- Runs under PM2 (cluster workers, 400M cap), so Settings → Processes has a real supervisor to report.',
            '- A second PM2 app scales that pool, so the autoscaling panel on that page reports a live configuration.',
            '- [ ] 🔄 Re-run admin preview',
            f"<!-- admin-preview:run={run_id} -->",
            '<!-- admin-preview:end -->',
        ]
        preview_block = '\n'.join(block_lines)

        def call_github(*gh_arguments, request_body=None):
            return subprocess.run(
                ['gh', 'api', *gh_arguments],
                input=request_body, capture_output=True, text=True, check=True,
            ).stdout

        pull_path = f"repos/{repository}/pulls/{pr_number}"
        pr_body = call_github(pull_path, '--jq', '.body // ""')
        block_pattern = re.compile(r'<!-- admin-preview:start -->.*?<!-- admin-preview:end -->', re.S)
        owner_match = re.search(r'<!-- admin-preview:run=(\d+) -->', pr_body)

        # Only the run that claimed the block rewrites it, so a superseded run's
        # "cancelled" never lands over the newer run's state.
        if preview_state != 'claimed' and (owner_match is None or owner_match.group(1) != run_id):
            print(f"block owned by run {json.dumps(owner_match and owner_match.group(1))}, not {json.dumps(run_id)}: left as is")
            sys.exit(0)

        if block_pattern.search(pr_body):
            new_body = block_pattern.sub(lambda _: preview_block, pr_body)
        elif pr_body.strip():
            new_body = pr_body.rstrip() + '\n\n' + preview_block
        else:
            new_body = preview_block

        # gh pr edit trips this repo's classic-Projects GraphQL bug → PATCH via REST.
        call_github('-X', 'PATCH', pull_path, '--input', '-', request_body=json.dumps({'body': new_body}))
        print(f"preview state {json.dumps(preview_state)} published")
      DB_CLIENT: pg
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_DATABASE: directus
      DB_USER: directus
      DB_PASSWORD: directus
      # Two tiers over the pgbouncer started below, so Settings → PgBouncer has real
      # pools to read: a tiny `free` beside a `premium` the admin policy is granted,
      # which is the tiering the granted-connection feature exists for. The base pool
      # stays direct, so migrations and DDL never ride a transaction-pooled session.
      DB_CONNECTIONS: free,premium
      DB_CONNECTION_FREE_PORT: '6432'
      DB_CONNECTION_FREE_DATABASE: directus_free
      DB_CONNECTION_PREMIUM_PORT: '6432'
      DB_CONNECTION_PREMIUM_DATABASE: directus_premium
      PGBOUNCER_REPORT_ENABLED: 'true'
      PGBOUNCER_CONNECTIONS: free,premium
      KEY: preview
      SECRET: preview
      CACHE_ENABLED: 'true'
      CACHE_STORE: redis
      REDIS: redis://localhost:6379
      CACHE_AUTO_PURGE: 'true'
      CACHE_AUTO_PURGE_MODE: scoped
      # Opt-in telemetry (default off) — on here so the Settings → Cache page has
      # live data + the enable/disable toggle to demo in the preview.
      CACHE_STATS_ENABLED: 'true'
      # Small cap so a big_items read trips value_too_large; normal reads still cache.
      CACHE_VALUE_MAX_SIZE: 4kb
      ADMIN_EMAIL: admin@example.com
      # Lax (not the strict default) so the session cookie survives the cross-site
      # /auto-login link → /admin redirect; strict withholds it on external arrival.
      SESSION_COOKIE_SAME_SITE: lax
      # info so each request logs a line — the idle watcher keys off log growth.
      LOG_LEVEL: info
      # Off — no realtime needed to browse a preview.
      WEBSOCKETS_ENABLED: 'false'
      PORT: '8055'
      # Started under PM2 below, so Settings → Processes has a real supervisor to
      # report: two cluster workers with a recycling cap, not a lone process.
      PROCESSES_SERVICE_NAME: preview
      PM2_HOME: /home/runner/.pm2
      # A second PM2 app scaling the first one, so Settings → Processes has a real
      # pool to report and its autoscaling panel has levers that move something.
      # Paced for a preview rather than for production: a short sample window and
      # cooldowns measured in seconds, so a change is visible while it is watched.
      PM2_AUTOSCALE_APP_NAME: directus
      PM2_AUTOSCALE_SAMPLE_WINDOW: '3'
      PM2_AUTOSCALE_MAX_WORKERS: '6'
      PM2_AUTOSCALE_MIN_SECONDS_TO_ADD_WORKER: '10'
      PM2_AUTOSCALE_MIN_SECONDS_TO_RELEASE_WORKER: '30'
      PM2_AUTOSCALE_WARMUP_SECONDS: '15'
      # The load drill, so the panel's ramp-up button has a pool to ramp.
      PM2_AUTOSCALE_DRILL_ENABLED: 'true'
    steps:
      - name: Mark the preview deploying in the PR description
        if: env.PREVIEW_PR != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PREVIEW_STARTED_AT=$(date +%s)
          echo "PREVIEW_STARTED_AT=$PREVIEW_STARTED_AT" >> "$GITHUB_ENV"
          export PREVIEW_STARTED_AT
          python3 -c "$PREVIEW_PUBLISHER" claimed

          # Drop stale standalone preview comments (superseded by the description block).
          gh api "repos/$GITHUB_REPOSITORY/issues/$PREVIEW_PR/comments" --paginate \
            --jq '.[] | select(.body | contains("🔎 Preview admin")) | .id' \
          | while read -r id; do
              [ -n "$id" ] && gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/comments/$id" >/dev/null || true
            done

      - name: Checkout the ref to preview
        uses: actions/checkout@v7
        with:
          # Untrusted head code runs here; don't leave the write-scoped token in .git/config.
          persist-credentials: false
          # Dispatch → the chosen ref; PR event → the PR head commit (the code to preview).
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.event.pull_request.head.sha }}

      - name: Prepare
        uses: ./.github/actions/prepare

      # A pooler in front of the same database, sized so the page shows every state
      # it can render: `free` starves at one server, `premium` carries the admin's
      # traffic, `default` is configured and never used. Host networking so it
      # reaches the postgres service on the runner's published port and Directus
      # reaches it back on 6432. The GHCR mirror of the same 1.25.2 the blackbox stack
      # runs; its config is mounted because the image otherwise regenerates one from
      # env, which can only describe a single wildcard pool.
      - name: Start pgbouncer
        run: |
          mkdir -p /tmp/pgbouncer

          cat > /tmp/pgbouncer/pgbouncer.ini <<'INI'
          [databases]
          directus_default = host=127.0.0.1 port=5432 dbname=directus user=directus password=directus pool_size=20
          directus_free = host=127.0.0.1 port=5432 dbname=directus user=directus password=directus pool_size=1
          directus_premium = host=127.0.0.1 port=5432 dbname=directus user=directus password=directus pool_size=4

          [pgbouncer]
          listen_addr = 0.0.0.0
          listen_port = 6432
          auth_type = trust
          auth_file = /etc/pgbouncer/userlist.txt
          pool_mode = transaction
          max_client_conn = 1000
          query_wait_timeout = 5
          admin_users = directus
          INI

          printf '"directus" "directus"\n' > /tmp/pgbouncer/userlist.txt

          docker run -d --name preview-pgbouncer --network host \
            -v /tmp/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro \
            -v /tmp/pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro \
            --entrypoint /usr/bin/pgbouncer \
            ghcr.io/jclaveau/pgbouncer:1.25.2 \
            /etc/pgbouncer/pgbouncer.ini

          for _ in $(seq 1 30); do
            (echo > /dev/tcp/127.0.0.1/6432) 2>/dev/null && break
            sleep 1
          done

          docker logs preview-pgbouncer

      - name: Start tunnel
        run: |
          curl -sL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o /tmp/cf
          chmod +x /tmp/cf
          # Straight to Directus (8055); it 502s until Directus is up a step later. No
          # hand-rolled proxy in front — a real HTTP server avoids the tunnel 530s a
          # fragile proxy caused.
          /tmp/cf tunnel --no-autoupdate --url http://localhost:8055 > /tmp/cf.log 2>&1 &

          for _ in $(seq 1 30); do
            URL=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/cf.log | head -1)
            [ -n "$URL" ] && break
            sleep 2
          done

          if [ -z "${URL:-}" ]; then
            echo "cloudflared did not produce a URL"; cat /tmp/cf.log; exit 1
          fi

          echo "URL=$URL" >> "$GITHUB_ENV"

      - name: Publish the preview link to the PR description
        # Runs as soon as the tunnel has a URL — a job summary and a `::notice`
        # only publish once the job ends, and this one stays up for hours, so the
        # description is the only channel that shows the link while it is usable.
        # Ticking the block's checkbox fires `edited` → a fresh run.
        if: env.PREVIEW_PR != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -c "$PREVIEW_PUBLISHER" booting

      - name: Bootstrap + start Directus
        run: |
          # Not masked on purpose: it shows in the run summary for manual login. On a public
          # repo that summary is world-readable — acceptable here, the instance is a throwaway
          # public admin (auto-login needs no password anyway).
          PW=$(openssl rand -hex 12)
          echo "ADMIN_PASSWORD=$PW" >> "$GITHUB_ENV"

          ADMIN_PASSWORD="$PW" node directus/cli.js bootstrap

          # Grant the admin policy the `premium` tier, so the preview's own traffic
          # is routed through pgbouncer and the page has a pool with live clients on
          # it rather than three idle ones. Applied before the server starts, since
          # the grant is read through the permissions cache.
          PG=${{ job.services.postgres.id }}
          docker exec "$PG" psql -U directus -d directus -c \
            "UPDATE directus_policies SET db_connections='premium' WHERE admin_access = true;"

          # Auto-login endpoint: relays a server-side session /auth/login to the browser,
          # so opening <url>/auto-login lands in the Data Studio with no password typing.
          # Extensions load as the dependencies of the PACKAGE_FILE_LOCATION package.
          AUTO_LOGIN=preview-extensions/node_modules/directus-extension-auto-login
          mkdir -p "$AUTO_LOGIN"
          cat > preview-extensions/package.json <<'PKG'
          {
            "name": "preview-extensions",
            "private": true,
            "dependencies": { "directus-extension-auto-login": "1.0.0" }
          }
          PKG
          cat > "$AUTO_LOGIN/package.json" <<'PKG'
          {
            "name": "directus-extension-auto-login",
            "version": "1.0.0",
            "type": "module",
            "keywords": ["directus-extension", "directus-custom-endpoint"],
            "directus:extension": {
              "type": "endpoint",
              "path": "index.js",
              "source": "index.js",
              "host": "^11.0.0"
            }
          }
          PKG
          cat > "$AUTO_LOGIN/index.js" <<'IDX'
          export default {
            id: 'auto-login',
            handler: (router, { env, logger }) => {
              router.get('/', async (req, res) => {
                try {
                  const port = env.PORT ?? 8055;
                  const upstream = await fetch(`http://127.0.0.1:${port}/auth/login`, {
                    method: 'POST',
                    headers: { 'content-type': 'application/json' },
                    body: JSON.stringify({
                      email: env.ADMIN_EMAIL ?? 'admin@example.com',
                      password: env.ADMIN_PASSWORD,
                      mode: 'session',
                    }),
                  });
                  if (!upstream.ok) {
                    logger.error(`auto-login: /auth/login returned ${upstream.status}`);
                    res.status(502).send('auto-login failed');
                    return;
                  }
                  const cookies = upstream.headers.getSetCookie?.() ?? [];
                  for (const cookie of cookies) res.append('set-cookie', cookie);
                  res.redirect('/admin/');
                } catch (err) {
                  logger.error(err, 'auto-login failed');
                  res.status(500).send('auto-login failed');
                }
              });
            },
          };
          IDX

          # The subscriptions bundle (#680), once the previewed ref ships it. No
          # provider key is passed: this job runs the PR head, which must not get
          # the secrets. Its tables and admin show; no provider is ever called.
          SUBSCRIPTIONS_BUNDLE="$PWD/packages/core-extensions/subscriptions"
          if [ -f "$SUBSCRIPTIONS_BUNDLE/dist/api.js" ]; then
            mkdir -p preview-extensions/node_modules/@scalabus
            ln -s "$SUBSCRIPTIONS_BUNDLE" \
              preview-extensions/node_modules/@scalabus/subscriptions
            jq '.dependencies["@scalabus/subscriptions"] = "0.1.0"' \
              preview-extensions/package.json > /tmp/preview-extensions.json
            mv /tmp/preview-extensions.json preview-extensions/package.json
            # The bootstrap above ran before the bundle was installed, so its
            # tables are created here, the way production migrates a bundle.
            PACKAGE_FILE_LOCATION="$PWD/preview-extensions" \
              node directus/cli.js database migrate:latest
            echo "subscriptions bundle loaded"
          else
            echo "no subscriptions bundle in this ref: not loaded"
          fi

          # Under PM2, the way the published image runs it, so the Processes page
          # has a supervisor to report, pointed at one log file so the streaming
          # step below is unchanged.
          npm install --global pm2@5
          # --wait-ready and the matching listen_timeout are what
          # ecosystem.config.cjs declares, and a rolling restart retiring a
          # worker before its replacement serves is what they prevent.
          ADMIN_PASSWORD="$PW" PUBLIC_URL="$URL" \
            PACKAGE_FILE_LOCATION="$PWD/preview-extensions" \
            pm2 start directus/cli.js \
            --name directus \
            --instances "${{ inputs.instances || '3' }}" \
            --max-memory-restart 400M \
            --wait-ready \
            --listen-timeout 15000 \
            --output /tmp/directus.log \
            --error /tmp/directus.log \
            -- start

          pm2 start directus/cli.js \
            --name autoscale \
            --output /tmp/directus.log \
            --error /tmp/directus.log \
            -- autoscale

          for _ in $(seq 1 60); do
            curl -sf http://localhost:8055/server/health >/dev/null 2>&1 && break
            sleep 2
          done

      - name: Seed items → sub_items
        run: |
          cat > /tmp/seed.mjs <<'JS'
          const BASE = 'http://localhost:8055';

          const login = await fetch(`${BASE}/auth/login`, {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ email: 'admin@example.com', password: process.env.ADMIN_PASSWORD }),
          });

          const token = (await login.json()).data.access_token;
          const H = { 'content-type': 'application/json', authorization: `Bearer ${token}` };
          const post = (p, b) => fetch(`${BASE}${p}`, { method: 'POST', headers: H, body: JSON.stringify(b) });

          const idField = {
            field: 'id',
            type: 'integer',
            meta: { hidden: true, interface: 'input', readonly: true },
            schema: { is_primary_key: true, has_auto_increment: true },
          };

          const userCreated = (collection) => [
            post(`/fields/${collection}`, {
              field: 'user_created',
              type: 'uuid',
              meta: { special: ['user-created'], interface: 'select-dropdown-m2o' },
              schema: {},
            }),
            post('/relations', {
              collection,
              field: 'user_created',
              related_collection: 'directus_users',
            }),
          ];

          await post('/collections', { collection: 'items', schema: {}, meta: {}, fields: [idField] });
          for (const r of userCreated('items')) await r;

          await post('/collections', { collection: 'sub_items', schema: {}, meta: {}, fields: [idField] });

          await post('/fields/sub_items', {
            field: 'item',
            type: 'integer',
            meta: { special: ['m2o'], interface: 'select-dropdown-m2o' },
            schema: {},
          });

          await post('/relations', { collection: 'sub_items', field: 'item', related_collection: 'items' });
          for (const r of userCreated('sub_items')) await r;

          // Self-relation on sub_items: a `?fields=*,parent.*` read reaches sub_items again
          // unbounded, so a scoped filter can't pin an owner slice → deriver null → coarse_scope.
          await post('/fields/sub_items', {
            field: 'parent',
            type: 'integer',
            meta: { special: ['m2o'], interface: 'select-dropdown-m2o' },
            schema: {},
          });

          await post('/relations', { collection: 'sub_items', field: 'parent', related_collection: 'sub_items' });

          // Rows so reads return data.
          const itemIds = [];
          for (let i = 0; i < 3; i++) {
            const created = await (await post('/items/items', {})).json();
            itemIds.push(created.data.id);
          }
          const subIds = [];
          for (let i = 0; i < 5; i++) {
            const sub = await (await post('/items/sub_items', { item: itemIds[i % itemIds.length] })).json();
            subIds.push(sub.data.id);
          }
          // A child pointing at a parent, so the self-referential read has a row to expand.
          await post('/items/sub_items', { item: itemIds[0], parent: subIds[0] });

          // big_items → value_too_large (a GET over CACHE_VALUE_MAX_SIZE).
          await post('/collections', { collection: 'big_items', schema: {}, meta: {}, fields: [idField] });
          await post('/fields/big_items', { field: 'blob', type: 'text', meta: {}, schema: {} });
          for (let i = 0; i < 5; i++) await post('/items/big_items', { blob: 'x'.repeat(2000) });

          console.log('seeded items + sub_items + big_items + rows');
          JS
          node /tmp/seed.mjs

      - name: Seed the previewed ref's fixtures
        id: fixtures
        # The link is already in the PR body: a broken fixture keeps the preview
        # up, without its data, and marks this step failed.
        continue-on-error: true
        # A hung script ends like a failing one, not at the job's 180 min.
        timeout-minutes: 5
        run: |
          # One script per feature the ref ships (e.g. the subscriptions bundle's
          # plans and users), so a PR seeds what it adds without a change here.
          # This job already runs the ref's code: its scripts add no trust.
          shopt -s nullglob
          for fixture_script in scripts/preview-admin/fixtures/*.mjs; do
            echo "running $fixture_script"
            node "$fixture_script"
          done

      - name: Mark the preview deployed in the PR description
        if: env.PREVIEW_PR != ''
        env:
          GH_TOKEN: ${{ github.token }}
          FIXTURES_OUTCOME: ${{ steps.fixtures.outcome }}
        run: python3 -c "$PREVIEW_PUBLISHER" deployed

      - name: Provoke + verify cache anomalies
        run: |
          # coarse_scope needs a scoped field on sub_items — set it in the DB (the API
          # doesn't whitelist the fork column); node clears the schema cache below.
          PG=${{ job.services.postgres.id }}
          docker exec "$PG" psql -U directus -d directus -c \
            "UPDATE directus_collections SET scoped_cache_fields='[\"user_created\"]' WHERE collection='sub_items';"

          cat > /tmp/verify.mjs <<'JS'
          import { writeFileSync } from 'node:fs';
          const BASE = 'http://localhost:8055';

          const login = await fetch(`${BASE}/auth/login`, {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ email: 'admin@example.com', password: process.env.ADMIN_PASSWORD }),
          });

          const token = (await login.json()).data.access_token;
          const H = { authorization: `Bearer ${token}` };
          const get = (p) => fetch(`${BASE}${p}`, { headers: H });

          // Clear the system cache so the SQL-set scoped_cache_fields enters the schema.
          await fetch(`${BASE}/utils/cache/clear?system`, { method: 'POST', headers: H });
          await new Promise((r) => setTimeout(r, 2000));

          // missing_scope — a collection-less cacheable read (no purge handle).
          await get('/server/info');
          // value_too_large — big_items response exceeds CACHE_VALUE_MAX_SIZE.
          await get('/items/big_items');
          // coarse_scope — a self-referential scoped read: parent.* reaches sub_items again
          // unbounded, so the owner filter can't pin a slice → deriver null → coarse tag.
          await get('/items/sub_items?fields=*,parent.*&filter[user_created][_eq]=$CURRENT_USER');

          // The stats flush cron drains the stream every 10s — wait for it.
          await new Promise((r) => setTimeout(r, 15000));

          const anomalies = (await (await get('/utils/cache/anomalies')).json()).data ?? [];

          // Self-check the auto-login endpoint server-side: it should 302 to /admin with a
          // session cookie set (the browser then lands logged in).
          const al = await fetch(`${BASE}/auto-login`, { redirect: 'manual' });
          const alCookies = al.headers.getSetCookie?.() ?? [];
          const sessionCookie = alCookies.find((c) => c.startsWith('directus_session_token='));

          const autoLogin = {
            status: al.status,
            location: al.headers.get('location'),
            setCookie: Boolean(sessionCookie),
            // SameSite=Lax is required: Strict withholds the cookie on the cross-site
            // /auto-login → /admin arrival, so the app can't refresh from it.
            sameSite: sessionCookie ? (sessionCookie.match(/SameSite=(\w+)/i)?.[1] ?? null) : null,
          };

          writeFileSync('/tmp/anomalies.json', JSON.stringify({ anomalies, autoLogin }, null, 2));

          const lines = anomalies.length
            ? anomalies.map((a) => `- ${a.reason} x${a.count} — ${a.path}`).join('\n')
            : '- (none surfaced yet — see the caveats)';

          console.log(lines);
          JS

          {
            echo "### Cache anomalies provoked"
            echo ""
            node /tmp/verify.mjs
            echo ""
            echo "_redis_error needs a real Redis fault, so it isn't auto-provoked; key_too_long no longer exists (the stats identity is a fixed-length hash)._"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload the provoked anomalies (machine-readable)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cache-anomalies
          path: /tmp/anomalies.json
          retention-days: 1
          if-no-files-found: warn

      - name: Stream logs + publish URL
        run: |
          # Live-stream everything to the run log for the job's lifetime (this step
          # stays alive, so its stdout keeps flowing in the Actions UI).
          tail -F /tmp/directus.log 2>/dev/null | sed 's/^/[directus] /' &

          REDIS=${{ job.services.redis.id }}
          if [ -n "$REDIS" ]; then
            ( docker exec "$REDIS" redis-cli monitor 2>&1 | sed 's/^/[redis] /' ) &
          fi

          PG=${{ job.services.postgres.id }}
          if [ -n "$PG" ]; then
            docker exec "$PG" psql -U directus -d directus \
              -c "ALTER SYSTEM SET log_statement='all';" \
              -c "SELECT pg_reload_conf();" >/dev/null 2>&1 || true
            ( docker logs -f "$PG" 2>&1 | sed 's/^/[pg] /' ) &
          fi

          {
            echo "### Preview admin"
            echo ""
            echo "- **Ref:** ${{ github.event.pull_request.head.ref || inputs.ref }}"
            echo "- **Open (auto-login):** ${URL}/auto-login"
            echo "- Manual: ${URL}/admin — admin@example.com / \`${ADMIN_PASSWORD}\`"
            echo "- Seeded collections: \`items\` → \`sub_items\` (both with \`user_created\`)."
            echo "- Stays up until the run's hard timeout; the link dies with the run."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::notice title=Preview admin::${URL}/auto-login"

          # No idle shutdown — stay up until the job's hard timeout, so a paused tab still
          # works when you come back (sleep, not wait, survives a dropped log stream).
          sleep infinity

      # A cancelled run (a new push, a click, or the job's timeout-minutes) and a
      # failed one both kill the tunnel: say so where the link was.
      - name: Mark the preview cancelled in the PR description
        if: cancelled() && env.PREVIEW_PR != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -c "$PREVIEW_PUBLISHER" cancelled

      - name: Mark the preview failed in the PR description
        if: failure() && env.PREVIEW_PR != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -c "$PREVIEW_PUBLISHER" failed
