name: Release Fork

on:
  push:
    branches:
      # release branches only — build a committed `<branch>-dist` for each *-hhh-dev line
      - '*-hhh-dev'
  # `dist-release` builds the same `<branch>-dist` for a PR's own head, so a consumer
  # can install the branch before it merges. Rebuilt on every push while the label is on.
  pull_request:
    types:
      - opened
      - synchronize
      - labeled
  # manual retry handle: a lost/timed-out push run can be replayed without a commit
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    name: Create Release
    # A push to a release line always builds. A PR builds only while it carries the
    # label, and only from this repo: a fork's `pull_request` token is read-only, so
    # the push at the end would fail after doing all the work.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
        contains(github.event.pull_request.labels.*.name, 'dist-release'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          # A `pull_request` checkout lands on the merge commit, whose dist would carry
          # a merge nobody asked for. `<branch>-dist` means the branch, so take its head.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Configure Git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Create new branch if it doesn't exist
        id: create_branch
        # Named from the event rather than the checkout: taking the PR's head sha
        # above leaves HEAD detached, so `rev-parse --abbrev-ref` would read `HEAD`.
        env:
          SOURCE_BRANCH: >-
            ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          DIST_BRANCH="${SOURCE_BRANCH}-dist"
          git push origin --delete "${DIST_BRANCH}" || true
          git checkout -b "${DIST_BRANCH}"
        shell: bash

      - name: Prepare
        uses: ./.github/actions/prepare
        with:
          registry: https://registry.npmjs.org

      - name: Pack and extract dist folders
        run: |
          # `pnpm pack` resolves catalog:/workspace: specs to concrete versions;
          # extracting the packed package.json back de-catalogs the tree so
          # external `github:` consumers can resolve deps (they can't read our catalog).
          pnpm -r --include-workspace-root exec sh -c '
            tarball=$(pnpm pack --pack-destination . 2>/dev/null | tail -1)
            if [ -f "$tarball" ]; then
              tar xf "$tarball" --strip-components=1 "package/package.json"
              echo "Extracted package.json from $tarball in $(pwd)"
              if tar tf "$tarball" | grep -q "^package/dist/"; then
                rm -rf dist
                tar xf "$tarball" --strip-components=1 "package/dist/"
                echo "Extracted dist from $tarball in $(pwd)"
              fi
              rm "$tarball"
            fi
          '
        shell: bash

      - name: Add and commit dist folder
        run: |
          # remove dist/ from gitignore
          mv .gitignore .gitignore.bak
          grep -v 'dist/' .gitignore.bak > .gitignore
          # cat .gitignore

          git add '**/dist/**'
          git add '**/package.json'

          git commit -m "Add dist folders content"
          git push origin HEAD
        shell: bash
