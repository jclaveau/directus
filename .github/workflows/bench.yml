name: Bench

on:
  # Benchmarks are slow and every run costs several runner-minutes, so the automatic
  # trigger waits for Check rather than racing it — a machine running two jobs at once
  # measures neither.
  workflow_run:
    workflows: [Check]
    types: [completed]
    # `ci-dialect-*` and `*-dist` are regenerated from the trunk on every push to it,
    # so each trunk commit produced three Check runs and, before this, three identical
    # benchmarks of the same content. Their branches carry no diff of their own.
    branches-ignore:
      - ci-dialect-*
      - '*-dist'

  # Measure an arbitrary ref on demand: a tag, an old commit, a branch nobody pushed to
  # today.
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag, or FULL 40-char commit to measure'
        required: false
        type: string
      baseline:
        description: 'What to measure it against (default: the ref before it)'
        required: false
        type: string
      reps:
        description: 'Measured boots per arm'
        required: false
        default: '7'
        type: string
      devserver:
        description: 'Also measure the admin dev server across vite majors (slow)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  statuses: write

# One measurement per ref at a time — two on the same runner pool would measure each
# other. Queue rather than cancel: a bench that was asked for was asked for on purpose.
concurrency:
  group: bench-${{ inputs.ref || github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: false

env:
  DB_CLIENT: pg
  DB_HOST: 127.0.0.1
  DB_PORT: '6100'
  DB_DATABASE: directus
  DB_USER: postgres
  DB_PASSWORD: secret
  CACHE_ENABLED: 'true'
  CACHE_STORE: redis
  REDIS: redis://127.0.0.1:6108
  KEY: bench-key
  SECRET: bench-secret
  ADMIN_EMAIL: admin@example.com
  ADMIN_PASSWORD: bench
  # Minted by `cli bootstrap` so a bench reaches the API with no login round trip.
  ADMIN_TOKEN: bench-admin-token
  TELEMETRY: 'false'
  EXTENSIONS_PATH: tests/perf/extensions

jobs:
  startup:
    name: Startup
    # Two workflows in this repo are named Check (check.yml and blackbox-pr.yml) and
    # `workflows:` matches on the name, so gate on the event that reached the one we
    # mean. A failed Check means the commit does not run; there is nothing to measure.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      # An abbreviated sha is not a ref: actions/checkout looks a bare one up as a
      # branch and then a tag, and fails with "could not be found". Fetch everything
      # and resolve it below instead of rejecting it.
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          # Deep enough to reach a merge base with the trunk; a shallow clone has no
          # commit to compare against.
          fetch-depth: 0

      # Both arms are measured in the same job, minutes apart on one machine. A shared
      # runner's absolute numbers belong to the runner — the same bundle has measured
      # 4.5 s and 6.5 s depending on what else was running — so only the ratio between
      # two arms taken together says anything about the diff.
      - name: Choose the commits to compare
        id: commits
        env:
          EXPLICIT_REF: ${{ inputs.ref }}
          EXPLICIT_BASELINE: ${{ inputs.baseline }}
        run: |
          if [ -n "$EXPLICIT_REF" ]; then
            git checkout --detach "$EXPLICIT_REF"
          fi

          head_sha=$(git rev-parse HEAD)

          if [ -n "$EXPLICIT_BASELINE" ]; then
            baseline_sha=$(git rev-parse "$EXPLICIT_BASELINE")
          else
            # On a branch, what the diff is against; on the trunk, the commit before.
            baseline_sha=$(git merge-base HEAD origin/${{ github.event.repository.default_branch }})

            if [ "$baseline_sha" = "$head_sha" ]; then
              baseline_sha=$(git rev-parse HEAD~1)
            fi
          fi

          {
            echo "head=$head_sha"
            echo "head_short=$(git rev-parse --short=10 "$head_sha")"
            echo "baseline=$baseline_sha"
            echo "baseline_short=$(git rev-parse --short=10 "$baseline_sha")"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare
        uses: ./.github/actions/prepare

      - name: Start database and cache
        run: docker compose -f tests/blackbox/docker-compose.yml up postgres redis -d --quiet-pull --wait

      # The bundle `pnpm --filter directus deploy` produces, which the blackbox suite
      # runs and production starts — not the workspace build. A benchmark of a shape
      # nobody deploys measures nothing.
      - name: Build the head bundle
        run: |
          pnpm --filter directus deploy --legacy --prod dist
          mv dist dist-head

      - name: Build the baseline bundle
        run: |
          git worktree add ../baseline ${{ steps.commits.outputs.baseline }}
          cd ../baseline
          pnpm install
          pnpm run build
          pnpm --filter directus deploy --legacy --prod dist
        env:
          npm_config_workspace_concurrency: 2
          NODE_OPTIONS: --max_old_space_size=6144

      # An empty extensions directory rather than none: a missing one makes every boot
      # log a resolution failure, and the retry is measured time.
      - name: Bootstrap the database
        run: |
          mkdir -p tests/perf/extensions
          node dist-head/cli bootstrap

      - name: Measure
        run: pnpm --filter tests-perf bench
        env:
          PERF_CLI: ${{ github.workspace }}/dist-head/cli
          PERF_CLI_BASELINE: ${{ github.workspace }}/../baseline/dist/cli
          PERF_REPS: ${{ inputs.reps || '7' }}
          PERF_HEAD_SHA: ${{ steps.commits.outputs.head }}
          PERF_BASELINE_SHA: ${{ steps.commits.outputs.baseline }}

      - name: Write the summary
        if: always()
        run: |
          for bench in startup resident; do
            if [ -f "tests/perf/results/$bench.md" ]; then
              cat "tests/perf/results/$bench.md" >> "$GITHUB_STEP_SUMMARY"
            else
              {
                echo "### ${bench^} — no result"
                echo ""
                echo "The measurement did not finish. See the job log."
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      # A workflow_run job does not appear in the commit's own check list, so without
      # this the number would exist only inside a run nobody opens.
      #
      # Not always(): that fires on cancellation too, and a bench someone stopped would
      # then mark the commit as failed on its way out.
      - name: Report on the commit
        if: '!cancelled()'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          report() {
            gh api "repos/${{ github.repository }}/statuses/${{ steps.commits.outputs.head }}" \
              -f state="$2" \
              -f context="Bench / $1" \
              -f description="$3" \
              -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }

          if [ -f tests/perf/results/startup.status.txt ]; then
            report startup success "$(cat tests/perf/results/startup.status.txt)"
          else
            report startup failure 'the measurement did not finish'
          fi

          # The resident bench has budgets, so its status carries a verdict: the
          # numbers are written whether or not they hold.
          if [ -f tests/perf/results/resident.status.txt ]; then
            if [ "$(jq -r .withinBudget tests/perf/results/resident.json)" = true ]; then
              report resident success "$(cat tests/perf/results/resident.status.txt)"
            else
              report resident failure "$(cat tests/perf/results/resident.status.txt)"
            fi
          else
            report resident failure 'the measurement did not finish'
          fi

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-startup-${{ steps.commits.outputs.head_short }}
          path: tests/perf/results/
          if-no-files-found: warn

  cache:
    name: Cache
    # Its own runner rather than a step in `startup`: the two would otherwise
    # measure each other, and this one needs no baseline bundle — every figure it
    # reports is a ratio between configurations of ONE build.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          fetch-depth: 0

      - name: Choose the commit to measure
        id: commits
        env:
          EXPLICIT_REF: ${{ inputs.ref }}
        run: |
          if [ -n "$EXPLICIT_REF" ]; then
            git checkout --detach "$EXPLICIT_REF"
          fi

          {
            echo "head=$(git rev-parse HEAD)"
            echo "head_short=$(git rev-parse --short=10 HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare
        uses: ./.github/actions/prepare

      - name: Start database and cache
        run: docker compose -f tests/blackbox/docker-compose.yml up postgres redis -d --quiet-pull --wait

      - name: Build the bundle
        run: pnpm --filter directus deploy --legacy --prod dist

      # An empty extensions directory rather than none: a missing one makes every
      # boot log a resolution failure, and four instances pay for it.
      - name: Bootstrap the database
        run: |
          mkdir -p tests/perf/cache-extensions
          node dist/cli bootstrap

      - name: Measure the cache
        id: measure
        run: pnpm --filter tests-perf bench:cache
        env:
          PERF_CLI: ${{ github.workspace }}/dist/cli
          PERF_HEAD_SHA: ${{ steps.commits.outputs.head }}
          PERF_REDIS: redis://127.0.0.1:6108

      - name: Write the summary
        if: always()
        run: |
          if [ -f tests/perf/results/cache.md ]; then
            cat tests/perf/results/cache.md >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### Cache — no result"
              echo ""
              echo "The measurement did not finish. See the job log."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # The status file is written before the gates are judged, so that a breach
      # still reports its figures — the verdict comes from the step, not the file.
      - name: Report on the commit
        if: '!cancelled()'
        env:
          GH_TOKEN: ${{ github.token }}
          MEASURED: ${{ steps.measure.outcome }}
        run: |
          if [ -f tests/perf/results/cache.status.txt ]; then
            description=$(cat tests/perf/results/cache.status.txt)
          else
            description='the measurement did not finish'
          fi

          if [ "$MEASURED" = success ]; then
            state=success
          else
            state=failure
          fi

          gh api "repos/${{ github.repository }}/statuses/${{ steps.commits.outputs.head }}" \
            -f state="$state" \
            -f context='Bench / cache' \
            -f description="$description" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-cache-${{ steps.commits.outputs.head_short }}
          path: tests/perf/results/
          if-no-files-found: warn

  devserver:
    name: Dev server
    # Dispatch only, and opt-in even then. Every other job here measures the API,
    # whose cost each trunk commit can move; this one measures which vite major
    # the admin is installed with, which changes in one commit and then not again
    # for a year. Running it per push would buy a flat line for four runner-hours
    # a month.
    if: github.event_name == 'workflow_dispatch' && inputs.devserver == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Identify the commit
        id: commits
        run: |
          if [ -n "${{ inputs.ref }}" ]; then
            git checkout --detach "${{ inputs.ref }}"
          fi

          {
            echo "head=$(git rev-parse HEAD)"
            echo "head_short=$(git rev-parse --short=10 HEAD)"
          } >> "$GITHUB_OUTPUT"

      # `build: false` — the admin dev server is the subject, and it compiles what
      # it serves on demand. A production bundle of the platform would be ten
      # minutes spent on an artifact nothing here opens.
      - name: Prepare
        uses: ./.github/actions/prepare
        with:
          build: 'false'

      # The admin's vite config imports `@directus/extensions`, so vite cannot even
      # load the config until that package has a dist — the dev server exits with
      # `Failed to resolve entry for package` before it opens a port. Only the
      # packages the app depends on are built, and only once: a dist lives in the
      # package directory rather than in node_modules, so the per-arm reinstall
      # below leaves it in place.
      - name: Build the packages the admin imports
        env:
          npm_config_workspace_concurrency: 2
          NODE_OPTIONS: --max_old_space_size=6144
        run: pnpm --filter '@directus/app^...' build

      # Two vite majors cannot be installed beside each other, so an arm is an
      # install rather than an environment variable, and the arms cannot be
      # interleaved rep by rep the way a cheaper comparison would be.
      #
      # `vite6-again` is the guard that replaces interleaving: it repeats the
      # first arm last, so drift on the runner shows up as a gap between two arms
      # that ran the same code. A local A/B of the same shape drifted 118-178 MB
      # between identical arms, which is wider than the effect being looked for,
      # and without the repeat there would be no way to see it had happened.
      #
      # `vite7` earns its slot by splitting the jump in two. It is the last major
      # still built on rollup and esbuild, so a gap between 6 and 7 is a year of
      # ordinary changes and a gap between 7 and 8 is the rolldown swap alone.
      # Without it a single 6-to-8 number cannot say which of the two moved.
      #
      # `vite8-rwt1-again` runs after `vite6-again` rather than beside its twin.
      # Two adjacent arms share whatever state the runner is in, so they would
      # agree for a reason that has nothing to do with the flag; put at the end it
      # is separated from `vite8-rwt1` by the same span `vite6-again` is separated
      # from `vite6`, and the two repeats are then measuring the same drift.
      - name: Measure each arm
        env:
          PERF_REPS: ${{ inputs.reps || '5' }}
          PERF_HEAD_SHA: ${{ steps.commits.outputs.head }}
        run: |
          set -euo pipefail

          arm() {
            local name=$1 vite=$2 plugin_vue=$3 threads=$4

            echo "::group::arm $name (vite $vite, ROLLDOWN_WORKER_THREADS=${threads:-unset})"

            # Only reinstall when the versions actually move: the two vite 8 arms
            # differ by an environment variable alone.
            if [ "$vite" != "$(sed -n 's/^  vite: //p' pnpm-workspace.yaml)" ]; then
              sed -i "s/^  vite: .*/  vite: $vite/" pnpm-workspace.yaml
              sed -i "s|^  '@vitejs/plugin-vue': .*|  '@vitejs/plugin-vue': $plugin_vue|" pnpm-workspace.yaml
              pnpm install --no-frozen-lockfile
            fi

            if [ -n "$threads" ]; then
              export ROLLDOWN_WORKER_THREADS="$threads"
            else
              unset ROLLDOWN_WORKER_THREADS
            fi

            PERF_ARM="$name" pnpm --filter tests-perf bench:devserver

            echo "::endgroup::"
          }

          arm vite6            6.4.3 6.0.1 ''
          arm vite7            7.3.6 6.0.1 ''
          arm vite8            8.3.0 6.0.9 ''
          arm vite8-rwt1       8.3.0 6.0.9 1
          arm vite6-again      6.4.3 6.0.1 ''
          arm vite8-rwt1-again 8.3.0 6.0.9 1

      - name: Write the summary
        if: always()
        run: |
          set -euo pipefail
          results=tests/perf/results

          if [ -z "$(ls $results/devserver.*.json 2>/dev/null)" ]; then
            {
              echo "### Dev server — no result"
              echo ""
              echo "The measurement did not finish. See the job log."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "### Dev server — peak resident by vite major"
            echo ""
            echo "| arm | vite | boot | cold optimize | graph | optimize time | graph time |"
            echo "| --- | --- | ---: | ---: | ---: | ---: | ---: |"
            jq -r '"| \(.arm) | \(.vite) | "
              + ([.phases[] | select(.name != "modules")
                  | "**\(.median | floor) MB**"] | join(" | "))
              + " | "
              + ([.durations[]
                  | "\((.median / 100 | floor) / 10) s"] | join(" | "))
              + " |"' $results/devserver.*.json
            echo ""
            echo "Median of $(jq -r '.reps | length' $results/devserver.vite6.json) cold boots per arm,"
            echo "$(jq -r '.modules[0]' $results/devserver.vite6.json) modules crawled each."
            echo ""
            echo "\`vite6\` is what the fork installs today. \`vite6-again\` and"
            echo "\`vite8-rwt1-again\` repeat an earlier arm at the end: the gap between a"
            echo "pair is the runner's drift, and no difference narrower than that gap is a"
            echo "result. The times are there because a capped worker pool is a cap on the"
            echo "transforming, so memory it gives back has a price to read off beside it."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report on the commit
        if: '!cancelled()'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          results=tests/perf/results

          if [ -f "$results/devserver.vite8.json" ] && [ -f "$results/devserver.vite6.json" ]; then
            state=success
            description=$(jq -rs '
              (.[0].phases[] | select(.name == "graph") | .median) as $six
              | (.[1].phases[] | select(.name == "graph") | .median) as $eight
              | "vite6 \($six | floor) MB · vite8 \($eight | floor) MB"
                + " · \((($eight - $six) / $six * 100) | round)%"
            ' "$results/devserver.vite6.json" "$results/devserver.vite8.json")
          else
            state=failure
            description='the measurement did not finish'
          fi

          gh api "repos/${{ github.repository }}/statuses/${{ steps.commits.outputs.head }}" \
            -f state="$state" \
            -f context='Bench / devserver' \
            -f description="$description" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-devserver-${{ steps.commits.outputs.head_short }}
          path: tests/perf/results/
          if-no-files-found: warn
