table: directus_invites

fields:
  - field: id
    special:
      - uuid
    hidden: true
    readonly: true
    width: half

  - field: user
    hidden: true
    readonly: true
    width: half
    special:
      - m2o

  - field: role
    hidden: true
    readonly: true
    width: half
    special:
      - m2o

  # Set by the invite code: a `user-created` special would overwrite the null
  # of an invite naming no user.
  - field: user_created
    hidden: true
    readonly: true
    width: half
    special:
      - m2o

  - field: date_created
    hidden: true
    readonly: true
    width: half
    special:
      - date-created
