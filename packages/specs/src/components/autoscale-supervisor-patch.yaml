type: object
description: >
  A sparse patch over the pm2 options the next rolling restart carries. Null
  hands one option back to the environment. A value outside what an option
  accepts is refused rather than corrected.
properties:
  listenTimeout:
    type: integer
    nullable: true
    description: listen_timeout, in milliseconds, from 1000 to 600000.
  killTimeout:
    type: integer
    nullable: true
    description: kill_timeout, in milliseconds, from 100 to 600000.
  minUptime:
    type: integer
    nullable: true
    description: min_uptime, in milliseconds, from 100 to 600000.
  restartDelay:
    type: integer
    nullable: true
    description: restart_delay, in milliseconds, from 0 to 600000.
  maxRestarts:
    type: integer
    nullable: true
    description: max_restarts, from 0 to 1000.
  maxMemoryRestartMegabytes:
    type: integer
    nullable: true
    description: >
      max_memory_restart, in megabytes, from 64 to 65536. pm2 is handed the
      bytes this comes to.
  note:
    type: string
    nullable: true
