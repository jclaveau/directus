type: object
description: Shared settings, where they are kept, and who last wrote them.
properties:
  key:
    type: string
    description: The settings column the shared settings are stored in.
  sharedSettings:
    $ref: '../openapi.yaml#/components/schemas/AutoscaleSharedSettings'
  setByEmail:
    type: string
    nullable: true
    description: >
      The address of whoever wrote it, resolved from the id in the stamp. Null
      where the id names no user any more, or where nothing is stored.
