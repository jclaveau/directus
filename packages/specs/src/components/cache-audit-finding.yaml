type: object
description: One entry a cache audit did not judge fresh.
properties:
  verdict:
    type: string
    enum:
      - stale
      - tag_drift
      - raced
      - time_varying
      - expired
      - unreplayable
  reason:
    type: string
    nullable: true
    description: >
      The `unreplayable` reason (`user_inactive`, `user_bot`, `status_<code>`,
      `replay_unrecognized`), or what a replay answered instead of a body.
  redisKey:
    type: string
  cacheKey:
    type: string
  method:
    type: string
  url:
    type: string
  query:
    type: string
    description: A GET's query string as sent; a GraphQL read's document.
  user:
    type: string
    nullable: true
    description: The user the entry was filled for; null for the public user.
  collection:
    type: string
    nullable: true
  filledAt:
    type: integer
  ageMs:
    type: integer
  tags:
    type: array
    description: The tags it was filled under.
    items:
      type: string
  replayTags:
    type: array
    nullable: true
    description: The tags the replay pinned, where one answered.
    items:
      type: string
  diff:
    type: array
    nullable: true
    description: JSON pointers to the first differences, stored body against fresh.
    items:
      type: string
  purgesSinceFilled:
    type: array
    nullable: true
    description: >
      For a stale entry: the purges that covered it since its fill. Empty means
      its tags never named the write that changed it.
    items:
      type: object
