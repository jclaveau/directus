# Absent from the published spec where the endpoint is absent from the router.
x-enabled-by: SYSTEM_MCP_ENABLED
post:
  summary: Call a system tool
  description: >
    A read-only MCP (Model Context Protocol) endpoint over JSON-RPC 2.0,
    implementing the Streamable HTTP transport of revision 2025-06-18. Exposes
    the diagnostic reads as tools: the processes tree, the cache listings, one
    cache entry by key, anomalies, latencies, timeseries and telemetry state.
    Supports
    `initialize`, `ping`, `tools/list` and `tools/call`; every tool is
    annotated read-only.


    Admin only, authenticated as any other admin surface here — a session, or a
    Directus static token on an admin user. Which subsystems are exposed is set
    by SYSTEM_MCP_TOOLS, and the endpoint is served only where
    SYSTEM_MCP_ENABLED is on — elsewhere the path is absent rather than
    refusing. Browser callers must send an Origin named in
    SYSTEM_MCP_ALLOWED_ORIGINS; a caller with no Origin is not a browser.
    GET and DELETE are answered with 405: this server offers no SSE stream and
    opens no session.
  operationId: call-system-mcp
  requestBody:
    content:
      application/json:
        schema:
          type: object
          properties:
            jsonrpc:
              type: string
              enum: ['2.0']
            id:
              nullable: true
              oneOf:
                - type: string
                - type: integer
            method:
              type: string
              example: tools/call
            params:
              type: object
          required: ['jsonrpc', 'method']
  responses:
    '200':
      content:
        application/json:
          schema:
            type: object
            properties:
              jsonrpc:
                type: string
              id:
                nullable: true
                oneOf:
                  - type: string
                  - type: integer
              result:
                type: object
              error:
                type: object
      description: The JSON-RPC response
    '202':
      description: A notification was accepted, and is answered with no body
    '400':
      description: >
        The MCP-Protocol-Version header names a revision this server does not
        implement, or the body is a JSON-RPC response, which answers nothing this
        server asked
    '403':
      description: Not an admin, or an Origin that is not allowed
  # The 405 that GET and DELETE answer is stated in the description above rather
  # than declared: it belongs to no operation here, and giving those two methods
  # an operation object of their own would publish them as callable.
  tags:
    - System MCP
