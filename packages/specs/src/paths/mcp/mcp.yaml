post:
  summary: Call a diagnostics tool
  description: >
    A read-only MCP (Model Context Protocol) endpoint over JSON-RPC 2.0,
    exposing the diagnostic reads as tools an agent can discover and call:
    the processes tree, the cache listings, anomalies, latencies, timeseries and
    telemetry state. Supports `initialize`, `ping`, `tools/list` and
    `tools/call`. Needs an admin identity or an `Authorization: Mcp <token>`
    header naming a configured MCP_TOKENS value, and is served only where
    MCP_ENABLED is on.
  operationId: call-mcp
  requestBody:
    content:
      application/json:
        schema:
          type: object
          properties:
            jsonrpc:
              type: string
              enum: ['2.0']
            id:
              oneOf:
                - type: string
                - type: integer
            method:
              type: string
              example: tools/call
            params:
              type: object
          required: ['jsonrpc', 'method']
  responses:
    '200':
      content:
        application/json:
          schema:
            type: object
            properties:
              jsonrpc:
                type: string
              id:
                oneOf:
                  - type: string
                  - type: integer
              result:
                type: object
              error:
                type: object
      description: The JSON-RPC response
    '202':
      description: A notification was accepted, and is answered with no body
  tags:
    - Mcp
