get:
  summary: List cache latencies
  description: Response-time percentiles per endpoint group in the window, split by outcome. Admin only.
  operationId: list-cache-latencies
  parameters:
    - name: window
      in: query
      required: false
      description: How far back to look, as a duration such as "15m", "6h" or "7d".
      schema:
        type: string
  responses:
    '200':
      content:
        application/json:
          schema:
            properties:
              data:
                type: array
                items:
                  type: object
            type: object
      description: Successful request
  tags:
    - Utilities
