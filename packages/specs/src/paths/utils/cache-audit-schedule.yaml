get:
  summary: Read the cache audit schedule
  description: >
    The cron rule the recurring audit runs on, whether it comes from the live
    `cache_audit_schedule` setting or from `CACHE_AUDIT_SCHEDULE`, what the
    environment says (which a cleared setting falls back to), and when the rule
    next fires. Admin only.
  operationId: read-cache-audit-schedule
  responses:
    '200':
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: '../../openapi.yaml#/components/schemas/CacheAuditSchedule'
      description: Successful request
    '404':
      description: The node has `CACHE_AUDIT_ENABLED` off; the audit is elsewhere
  tags:
    - System Diagnostics
patch:
  summary: Change the cache audit schedule
  description: >
    Store a cron rule in `directus_settings.cache_audit_schedule`, which every
    node picks up at once — no redeploy. `null` clears it, handing the schedule
    back to `CACHE_AUDIT_SCHEDULE`. A rule that is not a cron is refused.
    Admin only.
  operationId: update-cache-audit-schedule
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - rule
          properties:
            rule:
              type: string
              nullable: true
              description: A cron rule such as "0 3 * * *", or null to clear.
  responses:
    '200':
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: '../../openapi.yaml#/components/schemas/CacheAuditSchedule'
      description: Successful request
    '400':
      description: No `rule` was given, or it is not a cron rule
    '404':
      description: The node has `CACHE_AUDIT_ENABLED` off; the audit is elsewhere
  tags:
    - System Diagnostics
