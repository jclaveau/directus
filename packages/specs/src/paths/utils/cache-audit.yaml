post:
  summary: Audit the cache
  description: >
    Replay the live response-cache entries against the database, as the user
    each was filled for and through the same controller and hooks, and report
    the entries the database no longer answers with: `stale` (the body differs,
    and `purgesSinceFilled` says whether a purge covered the entry and left it,
    or none ever named the write), `tag_drift` (same body, other tags — one
    write from stale), `raced` (purged or refilled during the replay),
    `time_varying` (two fresh reads disagree), `expired`, and `unreplayable`
    with a `reason` (`user_gone`; `status_<code>`; `replay_unrecognized`).
    Entries are taken off their cache-stats descriptors, least recently
    verified first — audited, or filled where that came later; one filled
    while cache stats were off has no descriptor and is not seen — and a run
    with a `limit` stops there while the next resumes behind it. Every replay is an uncached read. The run is recorded in the
    audit history (`/utils/cache/audits`), and stale and drifted entries are
    also recorded as `stale_entry` / `tag_drift` cache anomalies. Admin only.
  operationId: audit-cache
  requestBody:
    content:
      application/json:
        schema:
          type: object
          properties:
            limit:
              type: integer
              minimum: 1
              description: >
                Stop after this many entries; the next run resumes behind
                them. `CACHE_AUDIT_LIMIT` when absent, the whole cache when
                that is 0.
            user:
              type: string
              description: Only the entries filled for this user id.
            collection:
              type: string
              description: Only the entries whose root collection is this one.
            ignore:
              type: array
              items:
                type: string
              description: >
                JSON-pointer globs left out of a diff, on top of
                CACHE_AUDIT_IGNORE_PATHS: `*` is one segment, `**` the rest.
            purge:
              type: boolean
              default: false
              description: Evict the stale and drifted entries once reported.
  responses:
    '200':
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  id:
                    type: integer
                    description: The run, as `/utils/cache/audits/{id}` reads it.
                  scanned:
                    type: integer
                  counts:
                    type: object
                    properties:
                      fresh:
                        type: integer
                      stale:
                        type: integer
                      tag_drift:
                        type: integer
                      raced:
                        type: integer
                      time_varying:
                        type: integer
                      expired:
                        type: integer
                      unreplayable:
                        type: integer
                  findings:
                    type: array
                    description: One per entry that is not fresh.
                    items:
                      $ref: '../../openapi.yaml#/components/schemas/CacheAuditFinding'
                  evicted:
                    type: integer
                  durationMs:
                    type: integer
      description: Successful request
    '400':
      description: A parameter was invalid
    '404':
      description: The node has `CACHE_AUDIT_ENABLED` off; the audit is elsewhere
  tags:
    - System Diagnostics
