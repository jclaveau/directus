get:
  summary: Read the cache settings
  description: >
    The cache settings stored in the settings singleton, the column they live
    in, and every field as the answering node resolves it: its value, whether
    that comes from the settings or the environment, and what clearing the
    field would leave it on. Admin only.
  operationId: read-cache-settings
  responses:
    '200':
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: '../../openapi.yaml#/components/schemas/CacheSettingsAnswer'
      description: Successful request
    '403':
      description: The caller is not an administrator
  tags:
    - System Diagnostics
patch:
  summary: Change the cache settings
  description: >
    Lays a patch over the cache settings, field by field. A field set to null
    is removed and handed back to its environment variable or default. The
    write goes through the settings guard, which refuses an unknown field or
    a value outside its rule, and switching `response` on where CACHE_RESPONSE,
    else CACHE_ENABLED, is off clears the response cache first. Every node
    reads the change on the bus. The stored layer is stamped with `setBy`,
    `setAt` and `setFrom: admin`, which a patch cannot send itself. Admin
    only.
  operationId: update-cache-settings
  requestBody:
    content:
      application/json:
        schema:
          type: object
          minProperties: 1
          additionalProperties: false
          properties:
            response:
              type: boolean
              nullable: true
              description: Over CACHE_RESPONSE, else CACHE_ENABLED.
            value_max_size:
              oneOf:
                - type: boolean
                  enum: [false]
                - type: string
              nullable: true
              description: false, or a size such as "2mb". Over CACHE_VALUE_MAX_SIZE.
            stats_max_bytes:
              oneOf:
                - type: boolean
                  enum: [false]
                - type: string
              nullable: true
              description: false, or a size such as "2gb". Over CACHE_STATS_MAX_BYTES.
            audit_limit:
              type: integer
              minimum: 0
              nullable: true
              description: Over CACHE_AUDIT_LIMIT.
            audit_max_duration:
              type: string
              nullable: true
              description: A duration such as "10m", up to "24h". Over CACHE_AUDIT_MAX_DURATION.
            scoped_index_scan_count:
              type: integer
              minimum: 1
              maximum: 100000
              nullable: true
              description: Over CACHE_SCOPED_INDEX_SCAN_COUNT.
            scoped_index_ttl_factor:
              type: number
              minimum: 1
              maximum: 100
              nullable: true
              description: Over CACHE_SCOPED_INDEX_TTL_FACTOR.
          example:
            audit_limit: 40
            value_max_size: null
  responses:
    '200':
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: '../../openapi.yaml#/components/schemas/CacheSettingsAnswer'
      description: Successful request
    '400':
      description: The patch names no field, an unknown field, or a value outside its rule
    '403':
      description: The caller is not an administrator
  tags:
    - System Diagnostics
delete:
  summary: Clear the cache settings
  description: >
    Clears the cache settings column, so every field comes from its
    environment variable or default again. Admin only.
  operationId: clear-cache-settings
  responses:
    '200':
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: '../../openapi.yaml#/components/schemas/CacheSettingsAnswer'
      description: Successful request
    '403':
      description: The caller is not an administrator
  tags:
    - System Diagnostics
