# Absent from the published spec where the endpoint is absent from the router.
x-enabled-by: PROCESSES_REPORT_ENABLED
get:
  summary: List running processes
  description: >
    The running processes of this deployment as a service, replica and process
    tree. Each process reports whichever halves PROCESSES_REPORT_DETAILS names:
    "stats", what its supervisor observed (status, restarts, memory against the
    cap it is recycled at, uptime, exec mode), and "env", the environment it
    resolved, redacted, with the layer each value came from. A deployment that
    named neither reports only the identity of each process, and the `details`
    field answers which of the two this one carries.
    Admin only, and served only where PROCESSES_REPORT_ENABLED is on —
    elsewhere the path is absent rather than refusing.
  operationId: list-processes
  parameters:
    - name: details
      in: query
      required: false
      description: >
        Which halves to report, comma-separated. Narrows what
        PROCESSES_REPORT_DETAILS names and can never widen it, so asking for a
        half this deployment does not report answers without it rather than
        with it. Omitted means everything the deployment reports. The resolved
        environment is most of the answer by size, so a caller that only needs
        the supervisor's view should ask for "stats" alone.
      schema:
        type: string
        example: stats
  responses:
    '200':
      content:
        application/json:
          schema:
            properties:
              data:
                type: object
                properties:
                  collectedAt:
                    type: integer
                  collectedForMs:
                    type: integer
                  details:
                    type: array
                    items:
                      type: string
                      enum: [stats, env]
                  services:
                    type: array
                    items:
                      type: object
                  degraded:
                    type: object
                    properties:
                      crossReplica:
                        type: boolean
                      supervisor:
                        type: boolean
            type: object
      description: Successful request
  tags:
    - System Diagnostics
