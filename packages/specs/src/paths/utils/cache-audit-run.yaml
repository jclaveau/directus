get:
  summary: Read one cache audit run
  description: >
    One audit run with a page of the findings it stored — each entry it did
    not judge `fresh`, in the order the run stored them. `findingsTotal`
    says how many there are under the narrowing asked for, whatever the
    page. Admin only.
  operationId: read-cache-audit
  parameters:
    - name: id
      in: path
      required: true
      description: The run, as `id` in the listing.
      schema:
        type: integer
    - name: limit
      in: query
      description: Findings per page.
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 100
    - name: offset
      in: query
      description: How many findings to skip.
      schema:
        type: integer
        minimum: 0
        default: 0
    - name: verdict
      in: query
      description: Only the findings of this verdict.
      schema:
        type: string
        enum:
          - stale
          - tag_drift
          - raced
          - time_varying
          - expired
          - unreplayable
  responses:
    '200':
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                allOf:
                  - $ref: '../../openapi.yaml#/components/schemas/CacheAuditRun'
                  - type: object
                    properties:
                      findings:
                        type: array
                        description: The page asked for.
                        items:
                          $ref: '../../openapi.yaml#/components/schemas/CacheAuditFinding'
                      findingsTotal:
                        type: integer
                        description: >
                          How many findings the run stored, of the verdict
                          asked for.
      description: Successful request
    '400':
      description: The `id` is not a positive integer, or the page is not one
    '403':
      description: No run has that id
    '404':
      description: The node has `CACHE_AUDIT_ENABLED` off; the audit is elsewhere
  tags:
    - System Diagnostics
