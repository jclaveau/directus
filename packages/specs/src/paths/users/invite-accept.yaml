post:
  summary: Accept User Invite
  description: >-
    Accepts an invite using a JWT invitation token: logged out, creates the
    account of the invited email with the password sent; logged in, adds the
    invited roles to the logged-in account, sending no password.
  operationId: acceptInvite
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            token:
              type: string
              example: eyJh...KmUk
              description: Accept invite token.
            password:
              type: string
              description: >-
                Password of the account created; sent only when logged out.
              format: password
              example: d1r3ctu5
  responses:
    '200':
      description: Successful request
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: '../../openapi.yaml#/components/schemas/Users'
    '401':
      $ref: '../../openapi.yaml#/components/responses/UnauthorizedError'
    '404':
      $ref: '../../openapi.yaml#/components/responses/NotFoundError'
  tags:
    - Users
