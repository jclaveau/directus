name: onRepeatedRow
description: >
  What the update does with a row it is sent more than once. `refuse` refuses the update before any hook runs,
  and refuses a hook answering with a row twice; a row sent twice in one change is written once. `lastWins` writes
  every change in the order sent.
in: query
required: false
schema:
  type: string
  enum:
    - refuse
    - lastWins
  default: refuse
