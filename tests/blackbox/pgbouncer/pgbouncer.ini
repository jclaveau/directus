# Three pools over the same postgres db, sized to prove tier isolation under load:
# free is tiny (starves fast), premium is a few connections, default is large. A
# saturated small pool must not starve a larger one. TESTING ONLY.
[databases]
directus_default = host=postgres port=5432 dbname=directus user=postgres password=secret pool_size=50
directus_free = host=postgres port=5432 dbname=directus user=postgres password=secret pool_size=1
directus_premium = host=postgres port=5432 dbname=directus user=postgres password=secret pool_size=4

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = trust
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
max_client_conn = 1000
query_wait_timeout = 1
admin_users = postgres
